
# ==========================================================
# Dependabot Configuration
# Project: Cipher Analytics
# Purpose: Automated dependency maintenance and security
# ==========================================================

version: 2

updates:

  # --------------------------------------------------------
  # 1. Python / Django Backend
  # --------------------------------------------------------
  - package-ecosystem: "pip"
    directories:
      - "**/*"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"

    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    versioning-strategy: "increase"

    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

    groups:
      python-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

      python-security:
        applies-to: "security-updates"
        patterns:
          - "*"

    labels:
      - "dependencies"
      - "python"

    commit-message:
      prefix: "chore(deps)"
      include: "scope"


  # --------------------------------------------------------
  # 2. React / Node.js Frontend
  # --------------------------------------------------------
  - package-ecosystem: "npm"
    directories:
      - "**/*"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Kolkata"

    open-pull-requests-limit: 5
    rebase-strategy: "auto"

    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

    groups:
      npm-production:
        applies-to: "version-updates"
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

      npm-development:
        applies-to: "version-updates"
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"

    labels:
      - "dependencies"
      - "javascript"

    commit-message:
      prefix: "chore(deps)"
      include: "scope"


  # --------------------------------------------------------
  # 3. Docker Images
  # --------------------------------------------------------
  - package-ecosystem: "docker"
    directories:
      - "**/*"

    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Kolkata"

    open-pull-requests-limit: 3
    rebase-strategy: "auto"

    cooldown:
      default-days: 7

    groups:
      docker-updates:
        applies-to: "version-updates"
        patterns:
          - "*"

      docker-security:
        applies-to: "security-updates"
        patterns:
          - "*"

    labels:
      - "dependencies"
      - "docker"

    commit-message:
      prefix: "chore(docker)"


  # --------------------------------------------------------
  # 4. GitHub Actions / CI-CD
  # --------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "Asia/Kolkata"

    open-pull-requests-limit: 3
    rebase-strategy: "auto"

    cooldown:
      default-days: 7

    groups:
      github-actions-updates:
        applies-to: "version-updates"
        patterns:
          - "*"

      github-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"

    labels:
      - "dependencies"
      - "github-actions"

    commit-message:
      prefix: "ci(deps)"
      include: "scope"
